name: Build and push the Django image

# The workflow_dispatch event will trigger the workflow from the GitHub Actions(ui).
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1: Check out the repository code so the workflow can find the Dockerfile
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 1b: Check out hy548 directly into the same path used by the Docker context
      - name: Checkout hy548 source
        uses: actions/checkout@v4
        with:
          repository: chazapis/hy548
          path: assignment 1/hy548
          fetch-depth: 1

      # 2: Log in to Docker Hub using credentials stored in GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3: Set up Docker Buildx 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4: Build the image and push it to my Docker Hub account
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: "./assignment 1/hy548/django"
          push: true
          # vazoyme tags sto image 'latest'. 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-django-app:latest
          
