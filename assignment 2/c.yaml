# Assignment 2 , 2)
# c. Nginx Deployment with Init Container, CronJob and PVC

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wget-script
data:
  download.sh: |
    #!/bin/bash
    apt-get update && apt-get install -y wget
    mkdir -p /data
    cd /data
    # Download the complete site
    wget -E -k -p https://csd.uoc.gr/
    DIR=$(find . -maxdepth 1 -type d -name "*csd.uoc.gr*" | head -n 1)
    if [ -n "$DIR" ]; then cp -a "$DIR"/. /data/; fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wget-cronjob
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: downloader
            image: ubuntu:24.04
            command: ["/bin/bash", "/scripts/download.sh"]
            volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: site-data
              mountPath: /data
          restartPolicy: OnFailure
          volumes:
          - name: script-vol
            configMap:
              name: wget-script
          - name: site-data
            persistentVolumeClaim:
              claimName: site-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
      - name: wait-for-download
        image: busybox:1.36
        command: ['sh', '-c', 'until [ -f /usr/share/nginx/html/index.html ]; do echo "Waiting for the web page to be downloaded..."; sleep 10; done']
        volumeMounts:
        - name: site-data
          mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        image: nginx:1.29.5-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site-data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: site-data
        persistentVolumeClaim:
          claimName: site-data-pvc
