apiVersion: apps/v1
kind: Deployment
metadata:
  name: csd-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csd-site
  template:
    metadata:
      labels:
        app: csd-site
    spec:
      containers:
      - name: nginx-csd
        image: teonikaris/nginx-wget-site:latest
        env:
        - name: SITE_URL
          value: "https://www.csd.uoc.gr"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: csd-service
spec:
  type: LoadBalancer
  selector:
    app: csd-site
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80