
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csd-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csd-site
  template:
    metadata:
      labels:
        app: csd-site
    spec:
      containers:
      - name: nginx-csd
        
        image: teonikaris/nginx-wget-site:v3
        env:
        - name: SITE_URL
          value: "https://www.csd.uoc.gr"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: csd-service
spec:
  type: LoadBalancer
  selector:
    app: csd-site
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: math-site
  template:
    metadata:
      labels:
        app: math-site
    spec:
      containers:
      - name: nginx-math
        
        image: teonikaris/nginx-wget-site:v3
        env:
        - name: SITE_URL
          value: "https://www.math.uoc.gr"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: math-service
spec:
  type: ClusterIP
  selector:
    app: math-site
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uoc-ingress
  annotations:
    # Strips /csd or /math from the URL before sending to the pod
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /csd(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: csd-service
            port:
              number: 80
      - path: /math(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: math-service
            port:
              number: 80