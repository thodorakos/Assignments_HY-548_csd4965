# Assignment 2 , 2)
# b. Nginx Pod, CronJob and PVC

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wget-script
data:
  download.sh: |
    #!/bin/bash
    apt-get update && apt-get install -y wget
    mkdir -p /data
    cd /data
    # Download the complete site
    wget -E -k -p https://csd.uoc.gr/
    DIR=$(find . -maxdepth 1 -type d -name "*csd.uoc.gr*" | head -n 1)
    if [ -n "$DIR" ]; then cp -a "$DIR"/. /data/; fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wget-cronjob
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: downloader
            image: ubuntu:24.04
            command: ["/bin/bash", "/scripts/download.sh"]
            volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: site-data
              mountPath: /data
          restartPolicy: OnFailure
          volumes:
          - name: script-vol
            configMap:
              name: wget-script
          - name: site-data
            persistentVolumeClaim:
              claimName: site-data-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.29.5-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: site-data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: site-data
    persistentVolumeClaim:
      claimName: site-data-pvc
