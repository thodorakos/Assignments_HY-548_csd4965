---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greeting-controller-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: greeting-controller-clusterrole
rules:
  # Permissions to manage the CRD
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Permissions to manage the Custom Resource
  - apiGroups: ["hy548.csd.uoc.gr"]
    resources: ["greetings", "greetings/status", "greetings/finalizers"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Permissions to create/manage Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Permissions to create/manage Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Permissions to log events (used by Kopf framework)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: greeting-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: greeting-controller-clusterrole
subjects:
  - kind: ServiceAccount
    name: greeting-controller-sa
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-controller
  template:
    metadata:
      labels:
        app: greeting-controller
    spec:
      serviceAccountName: greeting-controller-sa
      containers:
      - name: controller
        image: teonikaris/hy548-greeting-controller:v1